<!DOCTYPE <html>
<html>
<body>
    <p>temprature of a city in fahrenheit degrees is input through the keyboard.
        Write a program to convert this temprature into centigrade degree 
        <ul>(F-32)*(5/7)</ul>
    </p>
    <input type="number" id="heat" placeholder="Enter degrees">
    <button onclick="celc()">Convert-Centigrade</button>
    <hr>
    <div id="output"></div>

    <script>
        function celc(){
            temp = Number(document.getElementById("heat").value);
            con = (temp - 32) * (5/7);
             
            document.getElementById("output").innerHTML = ` The converted Centigrade degree is : ${con.toFixed(2)}`;
        }


    </script>
</body>
</html>
