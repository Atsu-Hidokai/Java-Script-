<!DOCTYPE html>
<html>
    <body>
        <style>
            table,tr,th,td {
                border: 2px solid black;
                border-collapse: collapse;
                padding: 5px;
            }

        </style>
        <p>A cashier has currency notes of denominations 10,50 and 100, If the amount to be withdrawn is input through
            the keyboard in hundreds, find the total number of currency notes of each denomination the cahier will have 
            to give the withdrawer.
        </p>
        <input type="number" id="digit" placeholder="Enter the cash">
        <button onclick="cash()">Segregate</button>
        <p id="output"></p>
        
        <script>
            function cash() {
                num = Number(document.getElementById("digit").value);
                note_100 = Math.floor(num / 100); 
                rem = num % 100 ;
                note_50 = Math.floor(rem / 50);
                rem = rem % 50;
                note_10 = Math.floor(rem / 10);
                rem = rem % 10;
                
                document.getElementById("output").innerHTML =`
                <table>
                    <tr>
                        <th>Total Amount</th>
                        <td>${num}</td>
                        </tr>
                        <tr>
                        <th>100's</th>
                        <td>${note_100}</td>
                        </tr>
                        <tr>
                        <th>50's</th>
                        <td>${note_50}</td>
                        </tr>
                        <tr>
                        <th>10's</th>
                        <td>${note_10}</td>
                        </tr>
                        <tr>
                        <th>Balance</th>
                        <td>${rem}</td>
                        </tr>
                    </table>
                `;
            }
        </script>
    </body>
</html>
