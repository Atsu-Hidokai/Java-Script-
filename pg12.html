<!DOCTYPE html>
<html>
<body>
    <p>If the total selling price of 15 items and the total profit earned on them is input through the keyboard
        write a program to find the cost price of one item.
    </p>
    <input type="number" id="sell_amt" placeholder="Enter the Selling Price">
    <input type="number" id="profit" placeholder="Enter the Profit Amount">
    <button onclick="cost()">Cost of 1-Item</button>
    <p id="output"></p>

    <script>
        function cost() {
            sell = Number(document.getElementById("sell_amt").value);
            profit = Number(document.getElementById("profit").value);
            cost_of_15 = sell - profit;
            cost_of_1 = cost_of_15 / 15;

            document.getElementById("output").innerHTML = `
            The cost price of 15 items ${cost_of_15.toFixed(2)} <br/>
            The cost price of 1 item is ${cost_of_1.toFixed(2)}
            `;
        }

    </script>
</body>
</html>
