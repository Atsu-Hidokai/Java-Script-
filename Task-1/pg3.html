<!doctype html>
<html>
  <body>
    <style>
        table,th,td {
            border-collapse: collapse;
            border: 1px solid black;
        };

    </style>
    <p>
      If the marks obatained by a student in five different subjects are input
      through the keyboard, find out the aggregated marks and percentage marks
      otained by the student. Assume that the maximum marks that can be a
      student in each subject is 100.
    </p>
    <input type="number" id="m1" placeholder="Enter mark 1" />
    <input type="number" id="m2" placeholder="Enter mark 2" />
    <input type="number" id="m3" placeholder="Enter mark 3" />
    <input type="number" id="m4" placeholder="Enter mark 4" />
    <input type="number" id="m5" placeholder="Enter mark 5" />
    <button onclick="avg()">Calculate Average</button>
    <hr />
    <p id="output"></p>
    <script>
      function avg() {
        Tam = Number(document.getElementById("m1").value);
        Eng = Number(document.getElementById("m2").value);
        Mat = Number(document.getElementById("m3").value);
        Sci = Number(document.getElementById("m4").value);
        Che = Number(document.getElementById("m5").value);

        tot = (Tam + Eng + Mat + Sci + Che) / 5;

        document.getElementById("output").innerHTML = `
             <table>
                <tr>
                    <th>Tamil Mark</th>
                    <td>${Tam}</td>
                    </tr>
                <tr>
                    <th>English Mark</th>
                    <td>${Eng}</td>
                    </tr>
                    <tr>
                    <th>Maths Mark</th>
                    <td>${Mat}</td>
                    </tr>
                    <tr>
                    <th>Science Mark</th>
                    <td>${Sci}</td>
                    </tr>
                    <tr>
                    <th> Chemistry Mark</th>
                    <td>${Che}</td>
                    </tr>
                    <tr>
                    <th>Average Mark</th>
                    <td>${tot}</td>
                    </tr>
                </table>
            
            `;
      }
    </script>
  </body>
</html>
