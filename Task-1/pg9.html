<!DOCTYPE html>
<html>
    <body>
        <p>If a four digit number is input through the keyboard, write a program to obtain the sum of the 
            first and last digit of this number.
        </p>
        <input type="number" id="add" placeholder="Enter 4 digits">
        <button onclick="add()">Add</button>
        <p id="output"></p>

        <script>
            function add() {
                num = Number(document.getElementById("add").value);
                l4 = num % 10;
                num = Math.floor(num / 10);
                l3 = num % 10;
                num = Math.floor(num / 10);
                l2 = num % 10;
                num = Math.floor(num / 10);
                l1 = num % 10;
                
                last_two_add = (l1 + l4);
                
                document.getElementById("output").innerHTML = `
                The sum of first and the last digits ${last_two_add}
                `;
            }
        </script>

    </body>
</html>
