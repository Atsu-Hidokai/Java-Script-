<!DOCTYPE html>
<html>
    <body>
        <p>If a five-digit number is input through the keyboard,write a program to reverse the digits.</p>
        <input type="number" id="rev" placeholder="Enter five digits">
        <button onclick="rev()">Reverse</button>
        <div id="output"></div>

        <script>
            function rev() {
                num = Number(document.getElementById("rev").value);
                l5 = num % 10;
                num = Math.floor(num / 10);
                l4 = num % 10;
                num = Math.floor(num / 10);
                l3 = num % 10;
                num = Math.floor(num / 10);
                l2 = num % 10;
                num = Math.floor(num / 10);
                l1 = num % 10;

                reverse = (l5 * 10000) + (l4 * 1000) + (l3 * 100) + (l2 * 10) + (l1 * 1);
                document.getElementById("output").innerHTML = `
                The reversed element is ${reverse}
                `; 
            }
        </script>
    </body>
</html>
