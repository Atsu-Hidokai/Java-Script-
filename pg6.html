<!DOCTYPE html>
<html>
    <body>
        <p>Two numbers are input through the keyboard into two locations c and d write a program 
            to interchange the contents of c and d.
        </p>
        <input type="text" id="t1" placeholder="Enter c">
        <input type="text" id="t2" placeholder="Enter d">

        <button onclick="swap()">Swap</button>
        <div id="output"></div>

        <script> 
        function swap() {
             c = document.getElementById("t1").value; //ant
             d = document.getElementById("t2").value; //ele

             temp = d; //ele
             d = c;    //ant
             c = temp; //ele

             document.getElementById("output").innerHTML = `
             The swapped Element of C is ${c} <br/>
             The swapped Element of D is ${d}.

             `;

        }

        </script>
    </body>
</html>
