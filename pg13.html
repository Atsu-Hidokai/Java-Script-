<!doctype html>
<html>
  <body>
    <p>
      If a five-digit number is input through the keyboard, write a program to
      print a new number by adding one to each of its digits.for example if the
      number that is input is 12391 then the answer should be displayed as
      23402.
    </p>
    <input type="number" id="num" placeholder="Enter 5 digit" />
    <button onclick="sum()">Add</button>
    <p id="output"></p>

    <script>
      function sum() {
        num = Number(document.getElementById("num").value); //12565
        d5 = ((num % 10) + 1) % 10; //reminder stays here
        num = Math.floor(num / 10); //updation of the "num" variable
        d4 = ((num % 10) + 1) % 10;
        num = Math.floor(num / 10);
        d3 = ((num % 10) + 1) % 10;
        num = Math.floor(num / 10);
        d2 = ((num % 10) + 1) % 10;
        num = Math.floor(num / 10);
        d1 = ((num % 10) + 1) % 10;

        sum_5 = (d1 * 10000) + (d2 * 1000) + (d3 * 100) + (d4 * 10) + (d5 * 1);

        document.getElementById("output").innerHTML = `
                The sum of five digits ${sum_5}
                `;
      }
    </script>
  </body>
</html>
