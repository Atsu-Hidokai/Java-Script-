<!DOCTYPE html>
<html>

<body>
    <p>Write a program to find perfect numbers between the 1 to 1000</p>
    <style>
        input,
        div,
        button {
            display: block;
            margin-top: 0.5rem;
        }
    </style>
    <button onclick="findPerfect()">Find Perfects</button>
    <div id="output"></div>
    <script>
        function findPerfect() {
            const output = document.getElementById("output");
            for (let number = 1; number <= 1000; number++) {
                let result = 0;

                for (let i = 1; i < number; i++) {
                    if (number % i == 0) {
                        result += i;
                    }
                }
                if (result == number) {
                    output.innerHTML += `the perfect numbers are ${result}<br>`;
                }
            }

        }
    </script>
</body>

</html>
