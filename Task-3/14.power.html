<!DOCTYPE html>
<html>

<body>
    <style>
        input,
        div,
        button {
            margin-top: 0.5rem;
            display: block;
        }
    </style>
    <p>Write a program to find the power of the number</p>
    <input type="number" id="base" placeholder="Enter base number">
    <input type="number" id="power" placeholder="Enter power number">
    <button onclick="toPower()">Find Power</button>
    <div id="output"></div>

    <script>
        function toPower() {
            const output = document.getElementById("output");
            let base = Number(document.getElementById("base").value);
            let power = Number(document.getElementById("power").value);

            let result = 1;
            for (let i = 1; i <= power; i++) {
                result = result * base;
            }
            output.innerHTML = `The power of the ${base} number  is ${result}`;
        }
    </script>
</body>

</html>
