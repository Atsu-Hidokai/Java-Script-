<!DOCTYPE html>
<html>

<body>
    <style>
        input,
        div,
        button {
            display: block;
            margin-top: 15px;
        }
    </style>
    <p>Write a program to find the factor of the given program</p>
    <input type="number" id="num1" placeholder="Enter the number">

    <button onclick="checkFactor()">Find Factor</button>
    <div id="output"></div>

    <script>
        function checkFactor() {
            const num1 = Number(document.getElementById("num1").value);
            const output = document.getElementById("output");
            
            output.innerHTML = `The number factors are`;

            for (let num2 = 1; num2 <= num1; num2++) {
                if (num1 % num2 === 0) {
                    output.innerHTML += `${num2}`;
                }
            };
        }
    </script>
</body>

</html>
