<!DOCTYPE html>
<html>

<body>
    <p>Extracting Properties from an Array of Objects</p>
    <script>
        const users = [
            { name: "Ram", age: 30 },
            { name: "Sam", age: 25 },
            { name: "Ravi", age: 35 }
        ];
        const extrat = users.map(user => user.name);
        console.log(extrat);
    </script>
</body>

</html>
