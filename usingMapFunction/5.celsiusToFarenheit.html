<!DOCTYPE html>
<html>
    <body>
        <p>Given an array of temperatures in Celsius, convert each temperature to Fahrenheit.</p>
    <script>
        const celsiusTemperatures = [25, 30, 15, 10];
        const fahrenheit = celsiusTemperatures.map(temperature => (temperature * 1.8) + 32);
        console.log(fahrenheit);
    </script>
    </body>
</html>
