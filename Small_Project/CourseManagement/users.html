<!DOCTYPE html>

<html>

<head>
    <title>Student Details</title>
    <link rel="stylesheet" href="users.css">
</head>

<body>
    <div class="container">
        <h3>User Course Management</h3>
        <form action="#" id="frm" autocomplete="off">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter Name">
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter Age">
            </div>
            <div class="form-check-group">
                <label>Select Gender</label>
                <input type="radio" value="male" name="gender" checked><label for="male">Male</label>
                 <input type="radio" value="female" name="gender"><label for="female">Female</label>
            </div>
            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course">
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                </select>
            </div>
            <button id="btn" onclick="addStudents()">Save Data</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Course</th>
                    <th>Delete</th>
                </tr>
            <tbody>
            </tbody>
            </thead>
        </table>
    </div>

    <script src="users.js"></script>
</body>

</html>
