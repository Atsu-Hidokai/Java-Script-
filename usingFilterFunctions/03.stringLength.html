<!DOCTYPE html>
<html>

<body>
    <p>Filtering an array of strings to only include those of a certain length</p>
    <script>
        let words = ['cat', 'dog', 'elephant', 'fish', 'giraffe'];
        let threeWordLength = words.filter(word => word.length === 3);
        console.log(threeWordLength);
    </script>
</body>

</html>
