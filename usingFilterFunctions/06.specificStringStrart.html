<!DOCTYPE html>
<html>

<body>
    <p> Filtering an array of strings to only include those that start with a specific letter</p>
    <script>
        let words = ['cat', 'dog', 'elephant', 'fish', 'giraffe'];
        let specificLetter = words.filter(word => word.startsWith("c"));
        console.log(specificLetter);
    </script>
</body>

</html>
