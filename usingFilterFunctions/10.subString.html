<!DOCTYPE html>
<html>

<body>
    <p>Filtering an array of strings to only include those that contain a specific substring</p>
    <script>
        let words = ['cat', 'dog', 'elephant', 'fish', 'giraffe'];
        let substring = words.filter(word => word.includes("e"));
        console.log(substring);
    </script>
</body>

</html>
